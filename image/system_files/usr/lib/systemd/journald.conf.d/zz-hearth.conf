# Named zz- so it comes after the base image's own drop-ins (they set 50M).
# Keep enough of the journal to see why a boot ended badly: Steam and
# gamescope write thousands of lines a session, and at 50 MB only a few hours
# were left, so crashed boots had no logs at all (field report #44). /var has
# plenty of room; a month or 1 GB, whichever comes first.
[Journal]
SystemMaxUse=1G
MaxRetentionSec=1month
