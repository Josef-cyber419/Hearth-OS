# Hearth home screen layout.
#
# To customise without rebuilding the image, copy this file to
# ~/.config/hearth/apps.toml and edit it; the copy replaces this one.
#
# Each app needs `id`, `name`, and either `command` (string or list) or
# `flatpak` (a Flathub app ID, run with `flatpak run`). Optional keys:
#   args     extra arguments appended to the command
#   color    tile color, e.g. "#1b2838"
#   icon     path to a PNG shown on the tile
#   requires commands that must exist on PATH, or the tile is hidden
#   requires_files  files that must exist, or the tile is hidden (globs and ~ allowed)
#   confirm  ask "are you sure?" first (power actions)
#   home_button  false = don't close the app when Guide is held (default true)
#   background   keeps running while you use other apps (e.g. Discord)
#   pointer      the controller drives a mouse pointer while the app is shown
#   wm_class     the app's X11 window class, to recognise its windows
#   tag_windows  false for apps that manage gamescope focus themselves (Steam)
#
# Tiles whose flatpak or required command isn't installed are hidden
# automatically, so it's fine to list apps you haven't installed yet.
# The last row is where the controller's Start/Menu button jumps to.

title = "Hearth"

# The look, after a classic racing livery:
#   gulf     powder blue and marigold orange (default)
#   martini  navy, light blue and red
#   brg      British racing green with a yellow stripe
#   rosso    racing red with a yellow stripe
#   silver   silver-arrow grey
[theme]
livery = "gulf"
# "reduced" turns off the intro, launch zoom and other decorative motion.
motion = "full"

# Wii Remotes through a Mayflash DolphinBar in mode 4: navigate with the
# D-pad, A to open, B to go back, Home for the Quick Menu (hold: go home), and
# point at a tile to pick it. Dolphin gets the remotes while it runs.
[wii_remote]
enabled = true
# The pointer as a mouse (A clicks, 2 right-clicks): "apps" = apps with
# pointer = true (Discord), "always", or "never". Quick Menu → System switches
# it for the app in front.
mouse = "apps"

# The Quick Menu (tap the Guide button): audio, per-app volume, Discord, power.
[quick_menu]
# Pause the game while the menu is open, like a console's home menu.
pause_game = true

# Quick Resume, like an Xbox: holding Guide in a game pauses it and goes home;
# it waits in a "Quick Resume" row on top, and picking it carries on exactly
# where you were. Starting another game when the slots are full closes the
# oldest paused one (the home screen asks first). Steam isn't paused this way.
[home]
quick_resume = 2        # games kept paused, 0-3 (0 = off: holding Guide closes)

[controllers]
guide_hold = "resume"   # holding Guide in a game: "resume" (keep it paused) or "close"
# stick_deadzone = 15   # % of stick travel ignored (5-40); raise it if a worn stick drifts

[[rows]]
title = "Play"

  [[rows.apps]]
  id = "steam"
  name = "Steam"
  command = "/usr/libexec/hearth/hearth-steam"
  requires = ["steam"]
  # Steam uses the Guide button itself (its own Quick Access menu), and
  # manages gamescope focus itself. Leave via Steam's "Switch to Desktop".
  home_button = false
  tag_windows = false
  color = "#1b2838"

  [[rows.apps]]
  id = "library"
  name = "Library"
  command = "hearth:library"   # built in: every Steam and emulated game, pin your favourites
  color = "#3d4a5c"

  [[rows.apps]]
  id = "search"
  name = "Search"
  command = "hearth:search"   # built in: find any game or app (also the View / Share / − button)
  color = "#34495e"

  [[rows.apps]]
  # ES-DE: one menu, a tile per console you've added games for.
  # Installed per user by hearth-esde-update; see docs/EMULATION.md.
  id = "emulation"
  name = "Emulation"
  command = "/usr/libexec/hearth/hearth-emulation"
  requires_files = ["~/Applications/ES-DE.AppImage"]
  color = "#6b2fa0"

  [[rows.apps]]
  # Epic Games (and GOG, Amazon) through Heroic, which runs them with Proton.
  # Heroic has its own controller navigation. Installed games also show in
  # Hearth's Library and Continue row and start directly.
  id = "epic"
  name = "Epic Games"
  flatpak = "com.heroicgameslauncher.hgl"
  wm_class = "heroic"
  color = "#2a2a2e"

  [[rows.apps]]
  # Battle.net through Lutris: starts it once installed, otherwise opens
  # Lutris's Battle.net installer. The controller works as a mouse there.
  id = "battlenet"
  name = "Battle.net"
  command = "/usr/libexec/hearth/hearth-battlenet"
  flatpak = "net.lutris.Lutris"
  pointer = true
  color = "#0e4d8a"

  [[rows.apps]]
  id = "moonlight"
  name = "Moonlight"
  flatpak = "com.moonlight_stream.Moonlight"
  color = "#3c4a5c"

  [[rows.apps]]
  # Runs in the background while you play; the Quick Menu's Discord tab
  # mutes/deafens and switches to it. The controller works as a mouse there.
  id = "discord"
  name = "Discord"
  flatpak = "com.discordapp.Discord"
  background = true
  pointer = true
  wm_class = "discord"
  color = "#5865f2"

  [[rows.apps]]
  # A console (PS5, Switch 2, Xbox...) plugged into an Elgato capture card,
  # shown full screen. Appears when the card is plugged in. For other brands,
  # change the pattern here and set CAPTURE_DEVICE in /etc/hearth/capture.conf.
  id = "hdmi-in"
  name = "HDMI Input"
  command = "/usr/libexec/hearth/hearth-capture"
  requires_files = ["/dev/v4l/by-id/usb-Elgato*-video-index0"]
  color = "#8a5a00"

[[rows]]
title = "Watch"

  [[rows.apps]]
  id = "kodi"
  name = "Kodi"
  flatpak = "tv.kodi.Kodi"
  color = "#17b2e7"

  [[rows.apps]]
  # VacuumTube wraps YouTube's own TV/console interface, so it works with a
  # controller or remote the same way YouTube does on a smart TV.
  id = "youtube"
  name = "YouTube"
  flatpak = "rocks.shy.VacuumTube"
  color = "#c4302b"

  [[rows.apps]]
  id = "jellyfin"
  name = "Jellyfin"
  flatpak = "org.jellyfin.JellyfinDesktop"
  args = ["--tv", "--fullscreen"]
  color = "#5a3e8f"

  [[rows.apps]]
  id = "plex"
  name = "Plex"
  flatpak = "tv.plex.PlexHTPC"
  color = "#cc7b19"

  [[rows.apps]]
  # VacuumStream: a controller-first Twitch app (browse, follow, watch) with
  # Twitch's own player, like VacuumTube is for YouTube. Not on Flathub:
  # installed and kept up to date per user by hearth-twitch-update.
  id = "twitch"
  name = "Twitch"
  command = "/usr/libexec/hearth/hearth-twitch"
  requires_files = ["~/Applications/VacuumStream.AppImage"]
  color = "#9146ff"

  [[rows.apps]]
  # Android apps via Waydroid, using Bazzite's Game Mode launcher. Hidden
  # until Android is set up (`ujust setup-waydroid`); see docs/STREAMING.md.
  id = "android"
  name = "Android"
  command = "/usr/bin/waydroid-launcher"
  requires = ["waydroid"]
  requires_files = ["/var/lib/waydroid/waydroid.cfg"]
  color = "#2e7d32"

[[rows]]
title = "System"

  [[rows.apps]]
  id = "settings"
  name = "Settings"
  command = "hearth:settings"   # built into Hearth: look, Wii Remote, Bluetooth, Wi-Fi, ...
  color = "#4a5068"

  [[rows.apps]]
  id = "desktop"
  name = "Desktop Mode"
  command = "/usr/libexec/hearth/hearth-desktop"
  confirm = true
  color = "#2d5f8b"

  [[rows.apps]]
  id = "sleep"
  name = "Sleep"
  command = "systemctl suspend"
  color = "#3a3f58"

  [[rows.apps]]
  id = "restart"
  name = "Restart"
  command = "systemctl reboot"
  confirm = true
  color = "#3a3f58"

  [[rows.apps]]
  id = "poweroff"
  name = "Power Off"
  command = "systemctl poweroff"
  confirm = true
  color = "#5c2a2a"
