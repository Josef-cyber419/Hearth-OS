name: build

# main is live: its image is tagged :latest, which PCs follow by default.
# staging is for testing new work before it goes live: its image is tagged
# :staging (switch a PC to it with `hearthctl channel staging`).
#
# For now staging mirrors main: every build of main also publishes :staging
# and moves the staging branch to match. Set MIRROR_STAGING to "false" once
# new work should land on staging first.
env:
  MIRROR_STAGING: "true"

on:
  push:
    branches: [main, staging]
  pull_request:
  schedule:
    # Rebuild daily so the image picks up Bazzite and Fedora updates.
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Xvfb (for X11 integration tests)
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Launcher tests
        working-directory: launcher
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          pip install -e '.[dev]'
          pytest -q
      - name: Shellcheck
        run: |
          pip install shellcheck-py
          shellcheck -s bash image/build.sh image/system_files/usr/bin/* \
            image/system_files/usr/libexec/hearth/hearth-* \
            image/system_files/usr/libexec/hearth/shims/* \
            image/system_files/usr/lib/systemd/system-sleep/hearth-cec \
            image/system_files/etc/gamescope-session-plus/sessions.d/*

  image:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    # AMD/Intel graphics only (Bazzite's default deck image). NVIDIA isn't
    # supported: gamescope works best with the open AMD/Intel drivers.
    steps:
      - name: Free disk space
        # Bazzite images are large; the runner's preinstalled SDKs aren't needed.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - uses: actions/checkout@v4

      - name: Build
        run: |
          # GHCR image names must be lowercase.
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/hearth-os"
          echo "IMAGE=$image" >> "$GITHUB_ENV"
          podman build \
            --build-arg HEARTH_VERSION="$(date -u +%Y.%m.%d)-${GITHUB_SHA::7}" \
            --tag "$image:latest" \
            --tag "$image:${{ github.sha }}" \
            .

      - name: Push
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            channels=(latest)
            [[ "$MIRROR_STAGING" == true ]] && channels+=(staging)
          else
            channels=(staging)
          fi
          for channel in "${channels[@]}"; do
            podman tag "$IMAGE:latest" "$IMAGE:$channel"
            podman push "$IMAGE:$channel"
          done
          podman push "$IMAGE:${{ github.sha }}"

  mirror-staging:
    # Keep the staging branch on main's commit while staging mirrors main.
    # Fast-forward only: if staging has its own commits, this fails loudly
    # instead of throwing them away.
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        if: env.MIRROR_STAGING == 'true'
        with:
          fetch-depth: 0
      - name: Move staging to main
        if: env.MIRROR_STAGING == 'true'
        run: git push origin "HEAD:refs/heads/staging"
