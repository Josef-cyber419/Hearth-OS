name: build

# main is live: its image is tagged :latest, which PCs follow by default.
# staging is for testing new work before it goes live: its image is tagged
# :staging (switch a PC to it with `hearthctl channel staging`).
#
# For now staging mirrors main: every build of main also publishes :staging
# and moves the staging branch to match. Set MIRROR_STAGING to "false" once
# new work should land on staging first.
env:
  MIRROR_STAGING: "true"

on:
  push:
    branches: [main, staging]
  pull_request:
  schedule:
    # Rebuild daily so the image picks up Bazzite and Fedora updates.
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Xvfb (for X11 integration tests)
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Launcher tests
        working-directory: launcher
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: |
          pip install -e '.[dev]'
          pytest -q
      - name: Shellcheck
        run: |
          pip install shellcheck-py
          shellcheck -s bash image/build.sh image/system_files/usr/bin/* \
            image/system_files/usr/libexec/hearth/hearth-* \
            image/system_files/usr/libexec/hearth/shims/* \
            image/system_files/usr/lib/systemd/system-sleep/hearth-cec \
            image/system_files/etc/gamescope-session-plus/sessions.d/*

  image:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    # AMD/Intel graphics only (Bazzite's default deck image). NVIDIA isn't
    # supported: gamescope works best with the open AMD/Intel drivers.
    steps:
      - name: Free disk space
        # Bazzite images are large; the runner's preinstalled SDKs aren't needed.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - uses: actions/checkout@v4

      - name: Build
        run: |
          # GHCR image names must be lowercase.
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/hearth-os"
          echo "IMAGE=$image" >> "$GITHUB_ENV"
          # The release version (VERSION) on main; anything else is a build of
          # work towards it.
          version=$(cat VERSION)
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then version="$version-dev.${GITHUB_SHA::7}"; fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          podman build \
            --build-arg HEARTH_VERSION="$version" \
            --label org.opencontainers.image.version="$version" \
            --tag "$image:latest" \
            --tag "$image:${{ github.sha }}" \
            .

      - name: Push
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            channels=(latest "$VERSION")  # :0.20.0 stays pinned to that release
            [[ "$MIRROR_STAGING" == true ]] && channels+=(staging)
          else
            channels=(staging)
          fi
          for channel in "${channels[@]}"; do
            podman tag "$IMAGE:latest" "$IMAGE:$channel"
            podman push "$IMAGE:$channel"
          done
          podman push "$IMAGE:${{ github.sha }}"

  mirror-staging:
    # Keep the staging branch up with main while staging mirrors main.
    # Nothing to do when staging already has main's commit (new work pushed
    # to staging ahead of its pull request). Otherwise fast-forward only: if
    # staging has diverged, this fails loudly instead of throwing work away.
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        if: env.MIRROR_STAGING == 'true'
        with:
          fetch-depth: 0
      - name: Move staging to main
        if: env.MIRROR_STAGING == 'true'
        run: |
          if git fetch origin staging 2>/dev/null && git merge-base --is-ancestor HEAD FETCH_HEAD; then
            echo "staging already includes $GITHUB_SHA"
            exit 0
          fi
          git push origin "HEAD:refs/heads/staging"

  release:
    # Every version in CHANGELOG.md gets a tag (v0.20.0) and a GitHub release
    # with its notes: the current one on main's commit, earlier ones where
    # their tags already point. Versions that already have a release are left.
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag and publish releases
        run: |
          current=$(cat VERSION)
          for version in $(python3 tools/release_notes.py --versions); do
            tag="v$version"
            if gh release view "$tag" >/dev/null 2>&1; then
              continue
            fi
            if ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              if [[ "$version" == "$current" ]]; then
                commit=$GITHUB_SHA
              else  # released before tagging started
                commit=$(awk -v v="$version" '$1 == v {print $2}' tools/past-releases.txt)
              fi
              if [[ -z "$commit" ]]; then
                echo "::warning::$tag: no commit known for it; skipped"
                continue
              fi
              git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                tag -a "$tag" -m "Hearth OS $version" "$commit"
              git push origin "refs/tags/$tag"
            fi
            latest=false
            [[ "$version" == "$current" ]] && latest=true
            python3 tools/release_notes.py "$version" > notes.md
            gh release create "$tag" --verify-tag --title "Hearth OS $version" \
              --notes-file notes.md --latest="$latest"
          done
