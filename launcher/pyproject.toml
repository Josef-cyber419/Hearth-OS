[project]
name = "hearth"
version = "0.1.0"
description = "TV-style home screen and session hub for a living-room PC"
requires-python = ">=3.11"
# Fedora ships this as python3-pygame; pygame-ce works as a drop-in for development.
dependencies = [
    "pygame-ce>=2.4",
    "python-xlib>=0.33",  # gamescope window properties (Fedora: python3-xlib)
    "evdev>=1.6",  # Guide button and controller pointer (Fedora: python3-evdev)
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
hearth = "hearth.hub:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["hearth"]

[tool.setuptools.package-data]
hearth = ["fonts/*.ttf", "fonts/OFL.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
